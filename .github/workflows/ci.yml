name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope (deterministic portfolio only; GPU/full-safe have separate workflows)
        required: true
        default: smoke
        type: choice
        options: [smoke, full-safe]

permissions:
  contents: read

concurrency:
  group: shapeforge-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ inputs.suite == 'full-safe' && 'Full safe CPU suite' || 'Deterministic smoke and portfolio' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run deterministic tests
        if: ${{ inputs.suite != 'full-safe' }}
        run: |
          uv run pytest -q -n 0 -m 'not gpu and not llm and not slow' \
            tests/shared/test_structure.py \
            tests/shared/test_shape_portfolio_performance.py \
            tests/shared/test_shape_portfolio_candidate.py \
            tests/shared/test_shape_portfolio_dispatch.py \
            tests/shared/test_shape_portfolio_domain.py \
            tests/shared/test_shape_portfolio_evidence.py \
            tests/shared/test_shape_portfolio_runner.py \
            tests/shared/test_shape_portfolio_validation.py \
            tests/backends/metal/test_launch.py \
            tests/backends/metal/test_native_batch.py \
            tests/backends/metal/test_shape_portfolio_confirmation.py \
            tests/backends/metal/test_shape_portfolio_manifest.py \
            tests/backends/metal/test_shape_portfolio_resume.py

      - name: Run full safe suite
        if: ${{ inputs.suite == 'full-safe' }}
        run: uv run pytest -q -m 'not gpu and not llm and not slow'

      - name: Upload failure triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-triage-${{ inputs.suite == 'full-safe' && 'full-safe' || 'smoke' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/pytest/triage/
          if-no-files-found: ignore
          retention-days: 7

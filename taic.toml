# TAIC configuration. Credentials are never stored here: they are read at run time from the file below
# (or from OPENAI_API_KEY / OPENAI_BASE_URL, which take precedence).

[llm]
credentials_file = "~/.pi/agent/models.json"
provider = "deepseek"
model = "deepseek-flash"         # DeepSeek V4.1 Flash; "deepseek-v4-flash" / "deepseek-v4-pro" are also listed in models.json
reasoning_effort = "high"        # low / high / max (DeepSeek thinkingLevelMap); "off" disables thinking
echo_reasoning_content = true    # models.json: requiresReasoningContentOnAssistantMessages
use_tools = true                 # lookup_msl / quick_check function calling; false = full docs in the prompt, repair loop only
max_tokens = 48000               # per request; reasoning tokens count. 96000 and half of the 384K API maximum were considered on 2026-10-07 and set back the same day. Override per run with --max-tokens.
request_timeout_s = 900
max_retries = 6
extra_body = {}

[search]
budget_usd = 2.0                 # per kernel; override per task
branches = 3                     # K parallel patch requests per round
max_repair_tries = 3             # compile/ABI/safety repair turns for one candidate
max_rounds = 12                  # hard cap on diagnose-plan-branch-evaluate rounds
max_quick_checks = 3             # tool-called quick evaluations allowed per request
min_improvement = 1.005          # a candidate must be this much faster than the current best to replace it
noise_z = 2.0                    # ... and faster by this many standard errors (from the measured cv), so noise cannot crown a winner
confirm_top = 2                  # final re-measurement of up to this many candidates that are tied within noise; the fastest wins
eval_reps = 15
max_hangs = 1                    # stop the whole run after this many timed-out evaluations (a runaway GPU kernel can freeze the display)
profile_best = false           # Instruments (xctrace) trace of the winning kernel after the search (slow; reports spills, code size, thermal state)
patience = 4                   # stop after this many rounds without a new best
plan_mix = false               # the last plan of a round is a local, low-risk change (instruction/parameter level), the others are structural (paper Section 3.3)
init_samples = 1               # initial kernels sampled in parallel; the best eligible one seeds the search
profile_poor = false           # trace the seed of a round with Instruments when it is slower than the strongest baseline; spills, code size, GPU idle time go to the planner and the patch authors
profile_poor_below = 1.0       # "slower": speedup of the seed below this
profile_max = 4                # traces per run at most (tens of seconds each, exclusive GPU lock)

# Two committees take turns. Each has one member today; handoff is between committees, not inside one.
# A member is a provider and a model. Keys and base URLs stay in credentials_file.
# An explicit --model uses that model for both committees. Otherwise these two lines are who takes each turn.
[[committees]]
name = "first"

[[committees.members]]
provider = "deepseek"
model = "deepseek-flash"

[[committees]]
name = "second"

[[committees.members]]
provider = "deepseek"
model = "deepseek-flash"

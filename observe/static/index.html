<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!--OBSERVE_TOKEN-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观测</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1c1c1e; --muted: #6b7280; --line: #e6e8ee;
    --blue: #0a66c2; --green: #17803d; --red: #c2413a; --amber: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { flex: none; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
  button.quiet { font-size: 11px; font-weight: 400; line-height: 1.3; padding: 0 5px; color: var(--muted); }
  button:hover { border-color: #d3e4f6; color: var(--blue); }
  header, main { padding: 12px 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  header strong { font-size: 20px; font-weight: 650; margin-right: 6px; }
  .view { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .view.on { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; }
  th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 4px; font-variant-numeric: tabular-nums; }
  tr.pick, tr[data-run], tr[data-exp] { cursor: pointer; }
  tr.pick.on { background: #eef5fc; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .badge.over { background: var(--red); color: #fff; }
  .badge.exhausted { background: var(--amber); color: #fff; }
  .badge.near { background: #fde047; color: #4a3b00; }
  #hist-tools { margin-bottom: 8px; }
  #budget-modal, #settings-modal, #delete-modal, #feedback-modal, #stage-modal, #term-modal { position: fixed; inset: 0; background: rgba(20, 22, 28, .45); display: none; align-items: center; justify-content: center; z-index: 50; }
  #budget-modal.open, #settings-modal.open, #delete-modal.open, #feedback-modal.open, #stage-modal.open, #term-modal.open { display: flex; }
  #budget-modal .box, #settings-modal .box, #delete-modal .box, #feedback-modal .box, #stage-modal .box, #term-modal .box { background: var(--card); border-radius: 14px; padding: 18px 20px; width: min(520px, 94vw); }
  #term-modal .box { width: min(640px, 94vw); max-height: 86vh; display: flex; flex-direction: column; }
  #term-query { width: 100%; margin: 8px 0; flex: none; }
  #term-results { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  #term-modal .actions { flex: none; margin-top: 12px; }
  .term-hit { border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 8px; padding: 8px 10px; background: #f7f8fa; }
  .term-hit strong { display: block; margin-bottom: 4px; }
  .term-hit p { margin: 0; }
  .term-suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #stage-modal .box { width: min(760px, 94vw); max-height: 88vh; overflow: auto; }
  #stage-modal .excerpt { max-height: 42vh; }
  td.seq { cursor: pointer; }
  #feedback-modal label { display: block; margin: 8px 0 4px; }
  #feedback-modal select, #feedback-modal input, #feedback-modal textarea { width: 100%; }
  #feedback-modal textarea { min-height: 72px; }
  #feedback-modal-text { max-height: 120px; overflow: auto; }
  #delete-reason { width: 100%; min-height: 72px; margin-top: 6px; }
  .delete-warn { color: var(--red); font-weight: 650; margin: 0 0 8px; }
  .muted, .sub { color: var(--muted); }
  .sub { font-size: 12px; margin: 0 0 8px; }
  .drift, .red { color: var(--red); }
  .green { color: var(--green); }
  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(23, 128, 61, .45); }
    50% { opacity: .35; transform: scale(.85); box-shadow: 0 0 0 7px rgba(23, 128, 61, 0); }
  }
  .breathe { display: inline-block; width: 9px; height: 9px; margin: 0 6px 1px 0; border-radius: 50%; background: var(--green); vertical-align: middle; animation: breathe 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .breathe { animation: none; } }
  #budget-banner { margin: 0 0 10px; }
  .bb.alert { background: #fff8f1; border: 1px solid #f0c9a0; border-radius: 12px; padding: 8px 10px; }
  .bb.ok { color: var(--green); }
  .bb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; }
  .budget-toggle { margin-left: auto; }
  #budget-banner.budget-collapsed .bb-list { display: none; }
  #budget-banner.budget-collapsed .bb-head { margin-bottom: 0; }
  .bb-count { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .bb-count.over { background: var(--red); color: #fff; }
  .bb-count.exhausted { background: var(--amber); color: #fff; }
  .bb-count.near { background: #fde047; color: #4a3b00; }
  .bb-total { color: var(--muted); font-size: 12px; }
  .bb-list { max-height: 12rem; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .note-list { max-height: 12rem; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  #turns-live details { margin: 6px 8px; }
  #turns-live summary { cursor: pointer; }
  .pi-live { max-height: 16rem; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; background: #fff; }
  .pi-live p { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-list thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
  .bb-list .chip { display: block; overflow-wrap: anywhere; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: inherit; text-decoration: none; }
  .workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  #side { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .workspace.collapsed #side { flex: 0 0 auto; }
  .workspace.collapsed #side .side-block, .workspace.collapsed #side .side-title, .workspace.collapsed #side .runs-head, .workspace.collapsed #side .side-upper { display: none; }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; margin: -10px -10px 8px; padding: 10px 10px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  .side-upper { flex: 0 1 auto; min-height: 0; max-height: 42%; overflow: auto; }
  #side:has(.runs-panel.collapsed) { flex: 0 1 auto; max-height: 36%; }
  #side:has(.runs-panel.collapsed) .side-upper { max-height: none; flex: 1 1 auto; overflow: auto; }
  .runs-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; margin: 0 -10px; padding: 6px 10px; background: var(--card); }
  .runs-head .side-title { margin: 0; }
  .runs-panel { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .runs-panel.collapsed { flex: 0 0 auto; min-height: 0; }
  .runs-panel.collapsed #runs-body { display: none; }
  #runs-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #view-runs { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .runs-table-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
  #runs thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
  .detail-panel { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .detail-panel.collapsed { flex: 0 0 auto; }
  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px 12px 0 0; }
  .detail-head strong { font-size: 13px; color: var(--muted); }
  .detail-panel.collapsed .detail-head { border-radius: 12px; }
  .detail-panel.collapsed #detail-body { display: none; }
  .detail-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; padding: 14px; }
  .detail-scroll .view { border: 0; padding: 0; background: transparent; border-radius: 0; }
  .side-head strong { font-size: 13px; color: var(--muted); }
  .side-card { margin: 0 0 10px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; background: #fff; overflow: hidden; }
  .side-experiments { border-left-color: var(--blue); }
  .side-compare { border-left-color: var(--amber); }
  .runs-panel { border-top: 4px solid var(--green); background: #f7f8fa; }
  .side-title { margin: 0; padding: 8px 10px; font-size: 14px; font-weight: 650; color: var(--ink); background: #f7f8fa; border-bottom: 1px solid var(--line); }
  .side-card .side-block { padding: 0 8px 8px; }
  .runs-head { background: #f7f8fa; border-bottom: 1px solid var(--line); }
  .side-block { overflow-x: auto; }
  tr.on { background: #eef5fc; }
  .detail-split { display: grid; grid-template-columns: 1fr minmax(240px, 320px); gap: 12px; align-items: start; }
  .panel { background: #f7f8fa; border-radius: 12px; padding: 10px 12px; }
  .panel h3 { margin: 12px 0 6px; font-size: 15px; }
  .panel h3:first-child { margin-top: 0; }
  .stage { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; }
  .stage.on { background: #eef5fc; }
  .stage .name { flex: 1; }
  .stage .meta { color: var(--muted); font-size: 12px; }
  .mark { width: 16px; text-align: center; }
  .excerpt { margin: 0; background: #fff; border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: #333; max-height: 220px; overflow: auto; }
  .fb-list { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .fb-session { border: 1px solid var(--line); border-radius: 12px; background: #f7f8fa; overflow: hidden; }
  .fb-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--line); }
  .fb-head strong { font-size: 15px; }
  .fb-meta { color: var(--muted); font-size: 12px; }
  .fb-claims { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .fb-claim { background: #fff; border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; }
  .fb-claim.fb-system { border-left-color: var(--blue); }
  .fb-claim.fb-peer { border-left-color: var(--green); }
  .fb-claim.fb-diagnostic { border-left-color: var(--amber); }
  .fb-claim-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fb-kind { font-weight: 650; }
  .fb-claim .excerpt { background: #f7f8fa; }
  .badge.fb-pending { background: #fde047; color: #4a3b00; }
  .badge.fb-info { background: #eef2f6; color: var(--muted); }
  .fb-raw { margin: 0 10px 10px; }
  .fb-raw summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #settings-committees label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  #settings-committees select { flex: 1; }
  @media (max-width: 800px) {
    .detail-split { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <strong>观测</strong>
  <span id="feedback-badge" class="badge" hidden></span>
  <button type="button" id="term-open">术语</button>
  <button type="button" id="tab-experiments">实验</button>
  <button type="button" id="tab-compare">对照</button>
  <button type="button" id="tab-runs">运行</button>
  <button type="button" id="tab-ledger">花费账本</button>
  <button type="button" class="btn-budget" id="add-budget">加预算</button>
  <button type="button" class="btn-budget" id="settings-open">设置</button>
  <button type="button" class="btn-budget" id="reset-all">重置全部搜索</button>
  <button type="button" class="btn-budget btn-stop" id="stop-all">停止全部搜索</button>
</header>
<main>
  <div class="workspace" id="workspace">
  <aside id="side">
    <div class="side-head">
      <strong>名单</strong>
      <button type="button" id="side-toggle" aria-expanded="true" title="收起上面">收起</button>
    </div>
    <div class="side-upper">
    <section id="budget-banner" class="side-block"><!--BUDGET_BANNER--></section>
    <section class="side-card side-experiments">
      <h3 class="side-title">实验</h3>
      <section id="view-experiments" class="side-block"></section>
    </section>
    <section class="side-card side-compare">
      <h3 class="side-title">对照</h3>
      <section id="view-compare" class="side-block"><p class="muted">点一个实验看对照。</p></section>
    </section>
    </div>
    <div id="runs-panel" class="runs-panel">
    <div class="runs-head">
      <h3 class="side-title">运行</h3>
      <button type="button" id="runs-toggle" aria-expanded="true" title="收起运行">收起</button>
    </div>
    <div id="runs-body">
    <section id="view-runs" class="side-block">
    <div id="hist-tools"></div>
    <form id="run-filters">
      <label>题目 <input id="filter-task" name="task"></label>
      <label>dtype
        <select id="filter-dtype" name="dtype"><option value="">全部</option><option>fp16</option><option>bf16</option></select>
      </label>
      <label>模型 <input id="filter-model" name="model"></label>
      <label>状态
        <select id="filter-status" name="status">
          <option value="">全部</option>
          <option value="running">running</option>
          <option value="done">done</option>
          <option value="interrupted">interrupted</option>
          <option value="unknown">unknown</option>
        </select>
      </label>
      <button type="submit">筛选</button>
      <button type="button" id="runs-prev">上一页</button>
      <button type="button" id="runs-next">下一页</button>
      <span id="runs-page" class="muted"></span>
    </form>
    <div class="runs-table-scroll">
    <table id="runs"><thead><tr><th>运行</th><th>题目</th><th>发布</th><th>加速比</th><th>绑定</th><th>状态</th></tr></thead><tbody></tbody></table>
    </div>
    </section>
    </div>
    </div>
  </aside>
  <div id="detail-panel" class="detail-panel">
    <div class="detail-head">
      <strong>详情</strong>
      <button type="button" id="detail-toggle" aria-expanded="true" title="收起详情">收起</button>
    </div>
    <div id="detail-body" class="detail-scroll">
    <section id="view-detail" class="view on"><p class="muted">点上面一次运行，这里显示它的详情。</p></section>
    <section id="view-ledger" class="view"></section>
    </div>
  </div>
  </div>
</main>
<div id="budget-modal" role="dialog" aria-modal="true" aria-labelledby="bm-title">
  <div class="box">
    <h3 id="bm-title">加预算 Add budget</h3>
    <p class="muted" id="budget-note">写入口仍走 /control，令牌放在 X-Observe-Token。</p>
    <label>增加的美元 <input id="budget-amount" type="number" min="0.01" step="0.01" value="1"></label>
    <div class="actions">
      <button type="button" id="budget-save">确认</button>
      <button type="button" id="budget-close">关闭</button>
    </div>
  </div>
</div>
<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="box">
    <h3 id="settings-title">下次搜索的两个委员会</h3>
    <p class="muted" id="settings-note"></p>
    <div id="settings-committees"></div>
    <div class="actions">
      <button type="button" id="settings-save">保存</button>
      <button type="button" id="settings-close">关闭</button>
    </div>
  </div>
</div>
<div id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
  <div class="box">
    <h3 id="delete-title">删除记录</h3>
    <p class="delete-warn">不要乱删。这次请求的 IP 会和理由一起写进删除记录，写下后不能再删。</p>
    <p class="muted" id="delete-note"></p>
    <label>理由 <textarea id="delete-reason" maxlength="500" placeholder="写明为什么删。IP 会一并记下。"></textarea></label>
    <div class="actions">
      <button type="button" id="delete-save">确认删除</button>
      <button type="button" id="delete-close">关闭</button>
    </div>
  </div>
</div>
<div id="term-modal" role="dialog" aria-modal="true" aria-labelledby="term-modal-title">
  <div class="box">
    <h3 id="term-modal-title">术语</h3>
    <p class="muted">输入页面上看到的词。解释只覆盖这块看板上的说法。</p>
    <input id="term-query" type="search" placeholder="例如 falsified、计划结局、确认点" autocomplete="off">
    <div class="term-suggest" id="term-suggest"></div>
    <div id="term-results"></div>
    <div class="actions">
      <button type="button" id="term-close">关闭</button>
    </div>
  </div>
</div>
<div id="stage-modal" role="dialog" aria-modal="true" aria-labelledby="stage-modal-title">
  <div class="box">
    <h3 id="stage-modal-title">候选</h3>
    <div id="stage-modal-body"></div>
    <div class="actions">
      <button type="button" id="stage-close">关闭</button>
    </div>
  </div>
</div>
<div id="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
  <div class="box">
    <h3 id="feedback-modal-title">处理反馈</h3>
    <pre class="excerpt" id="feedback-modal-text"></pre>
    <p class="muted" id="feedback-modal-source"></p>
    <form id="feedback-review-form">
      <label>状态 <select name="status"><option>pending</option><option>adopted</option><option>rejected</option><option>done</option></select></label>
      <label>复核 <select name="verification"><option>unchecked</option><option>confirmed</option><option>refuted</option></select></label>
      <label>证据来源 <select name="evidence_source"><option value=""></option><option>report</option><option>calibration</option><option>probe</option><option>code</option><option>other</option></select></label>
      <textarea name="evidence" placeholder="证据"></textarea>
      <label>备注 <input name="note" placeholder="备注"></label>
      <label>topic <input name="topic" placeholder="topic"></label>
      <label>change_ref <input name="change_ref" placeholder="change_ref"></label>
      <p class="feedback-error" id="feedback-modal-error"></p>
      <div class="actions">
        <button type="button" id="feedback-save">保存审查</button>
        <button type="button" id="feedback-close">关闭</button>
      </div>
    </form>
  </div>
</div>
<script>
const OBSERVE_TOKEN = document.querySelector('meta[name="observe-token"]')?.content || "";
const LABELS = {over: "OVER BUDGET", exhausted: "BUDGET EXHAUSTED", near: "NEAR BUDGET"};
const LABELS_CN = {over: "超预算", exhausted: "预算耗尽", near: "接近预算"};
const FILTERS = [["all", "全部"], ["alert", "告警"], ["over", "超预算"], ["exhausted", "耗尽"], ["near", "接近"]];
const SORTS = [["time", "时间"], ["used", "预算占比"]];
let selectedExperiment = "";
let selectedRun = "";
let runsOffset = 0;
let runsToken = 0;
let visible = "experiments";
const RUNS_LIMIT = 50;
const applied = {task: "", dtype: "", model: "", status: ""};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function num(value) {
  return value == null || value === "" ? "—" : String(value);
}

function renderBanner(report) {
  const slot = document.getElementById("budget-banner");
  if (!slot || !report) return;
  slot.dataset.level = report.level || "ok";
  if (Array.isArray(report.flagged)) slot.innerHTML = bannerHtml(report);
  if (slot.classList.contains("budget-collapsed")) setBudgetCollapsed(true);
}

function bannerHtml(report) {
  const total = `${report.n_runs || 0} 个运行 · 总花费 $${Number(report.total_spent_usd || 0).toFixed(2)} / 预算合计 $${Number(report.total_budget_usd || 0).toFixed(2)}`;
  if (!report.n_flagged) return `<div class="bb ok" data-level="ok"><b>预算正常</b> <span class="bb-total">没有超预算、预算耗尽或接近预算的运行 · ${esc(total)}</span></div>`;
  const counts = ["over", "exhausted", "near"].filter((flag) => report["n_" + flag]).map((flag) => `<span class="bb-count ${flag}">${esc(report["n_" + flag])} ${esc(LABELS[flag])} ${esc(LABELS_CN[flag])}</span>`).join("");
  const over = report.total_over_usd ? ` · 超出合计 +$${Number(report.total_over_usd).toFixed(3)}` : "";
  const chips = (report.flagged || []).map((item) => {
    const names = (item.flags || [item.level]).map((flag) => LABELS[flag] || flag).join(" + ");
    const title = `${item.task || item.id || ""}${item.dtype ? " " + item.dtype : ""}`;
    return `<a class="chip ${esc(item.level)}" href="/?run=${encodeURIComponent(item.id || "")}" data-run="${esc(item.id)}"><b>${esc(item.id)}</b> <span>${esc(title)}</span> <i>${esc(names)}</i> <span>${esc(item.text)}</span></a>`;
  }).join("");
  return `<div class="bb alert ${esc(report.level)}" data-level="${esc(report.level)}"><div class="bb-head"><b class="bb-title">⚠ 预算告警 BUDGET ALERT</b>${counts}<span class="bb-total">${esc(total + over)}</span><button type="button" id="budget-toggle" class="budget-toggle" aria-expanded="true" title="收起预算告警">收起</button></div><div class="bb-list">${chips}</div></div>`;
}

async function refreshBanner() {
  const report = await (await fetch("/api/v2/budget")).json();
  renderBanner(report);
  const overview = await (await fetch("/api/v2/overview")).json();
  const slot = document.getElementById("feedback-badge");
  const pending = Number(overview.feedback_pending || 0);
  slot.hidden = pending <= 0;
  slot.textContent = pending > 0 ? pending + " 条代理反馈待审查" : "";
}

function showRight(name) {
  if (document.getElementById("detail-panel").classList.contains("collapsed")) setDetailCollapsed(false);
  visible = name === "ledger" ? "ledger" : "detail";
  document.getElementById("view-detail").classList.toggle("on", visible === "detail");
  document.getElementById("view-ledger").classList.toggle("on", visible === "ledger");
  if (visible === "ledger") loadLedger();
  else if (selectedRun) loadDetail(selectedRun);
}

function show(name) {
  if (name === "ledger" || name === "detail") showRight(name);
  else if (name === "compare" && selectedExperiment) loadCompare(selectedExperiment);
  else if (name === "runs") loadRuns();
  else if (name === "experiments") loadExperiments();
}

async function loadExperiments() {
  const rows = await (await fetch("/api/v2/experiments")).json();
  const host = document.getElementById("view-experiments");
  host.innerHTML = "<table><thead><tr><th>目录</th><th>种类</th><th>操作</th></tr></thead><tbody>" +
    rows.map((row) => `<tr class="${row.experiment_id === selectedExperiment ? "on" : ""}" data-exp="${esc(row.experiment_id)}"><td>${esc(row.experiment_id)}</td><td>${esc(row.kind)}</td><td><button type="button" class="quiet" data-delete-experiment="${esc(row.experiment_id)}">删除</button></td></tr>`).join("") +
    "</tbody></table>";
  host.querySelectorAll("[data-exp]").forEach((tr) => tr.addEventListener("click", () => {
    selectedExperiment = tr.dataset.exp;
    host.querySelectorAll("[data-exp]").forEach((row) => row.classList.toggle("on", row.dataset.exp === selectedExperiment));
    runsOffset = 0;
    loadCompare(selectedExperiment);
    loadRuns();
  }));
  host.querySelectorAll("[data-delete-experiment]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation();
    openDelete("experiment", button.dataset.deleteExperiment);
  }));
}

async function loadCompare(id) {
  const doc = await (await fetch("/api/v2/experiments/" + id.split("/").map(encodeURIComponent).join("/"))).json();
  const host = document.getElementById("view-compare");
  const arms = (doc.arms || []).map((arm) => {
    const fast = arm.fast && arm.fast["1"] ? arm.fast["1"].share : null;
    return `<tr><td>${esc(arm.arm_id)}</td><td>${esc(num(arm.median))}</td><td>${esc(num(fast))}</td><td>${esc(num(arm.gain_per_usd))}</td><td>${esc(arm.n)}</td></tr>`;
  }).join("");
  host.innerHTML = `<p>${esc(doc.verdict)} ${esc(doc.reason)}</p>` +
    `<p class="drift">drift: ${esc((doc.drift || []).join(", ") || "无")} · inferred: ${esc((doc.inferred || []).join(", ") || "无")}</p>` +
    `<table><thead><tr><th>臂</th><th>发布加速比中位数</th><th>fast_p</th><th>每美元增益</th><th>次数</th></tr></thead><tbody>${arms}</tbody></table>`;
}

function runQuery() {
  const params = new URLSearchParams({ limit: String(RUNS_LIMIT), offset: String(runsOffset) });
  for (const key of ["task", "dtype", "model", "status"]) {
    const value = applied[key];
    if (value) params.set(key, value);
  }
  if (selectedExperiment) params.set("experiment_id", selectedExperiment);
  return params;
}

async function loadRuns() {
  const token = ++runsToken;
  const page = await (await fetch("/api/v2/runs?" + runQuery())).json();
  if (token !== runsToken) return;
  const total = page.total || 0;
  const rows = page.runs || [];
  const start = total ? runsOffset + 1 : 0;
  const end = runsOffset + rows.length;
  document.getElementById("runs-page").textContent = `${start}–${end} / ${total}`;
  document.getElementById("runs-prev").disabled = runsOffset <= 0;
  document.getElementById("runs-next").disabled = runsOffset + rows.length >= total;
  const body = document.querySelector("#runs tbody");
  body.innerHTML = rows.map((row) => {
    const live = row.status === "running" ? `<span class="breathe" title="进行中"></span>` : "";
    const task = String(row.task || "").split("@")[0];
    return `<tr class="${row.run_id === selectedRun ? "on" : ""}" data-run="${esc(row.run_id)}"><td>${esc(row.run_id)}</td><td>${esc(row.task)} <button type="button" class="quiet" title="按题目名归档这个算子下已结束的搜索" data-delete-operator="${esc(task)}">删除</button></td><td>${row.publication === "in_progress" ? live : ""}${esc(row.publication)}</td><td>${esc(num(row.published_speedup))}</td><td>${esc(row.binding)}</td><td>${live}<span class="badge ${esc(row.status)}">${esc(row.status)}</span></td></tr>`;
  }).join("");
  body.querySelectorAll("[data-run]").forEach((tr) => tr.addEventListener("click", () => {
    selectedRun = tr.dataset.run;
    body.querySelectorAll("[data-run]").forEach((row) => row.classList.toggle("on", row.dataset.run === selectedRun));
    showRight("detail");
  }));
  body.querySelectorAll("[data-delete-operator]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation();
    openDelete("operator", button.dataset.deleteOperator);
  }));
}

function termQuery(raw) {
  return String(raw || "").trim().toLowerCase();
}

function termsFor(raw) {
  const query = termQuery(raw);
  if (!query) return TERMS.filter((item) => ["计划结局", "validated_win", "validated_tie", "falsified", "untested_impl_fail", "确认点", "候选", "加速比"].includes(item.name));
  return TERMS.filter((item) => (item.name + " " + item.keys.join(" ") + " " + item.text).toLowerCase().includes(query));
}

function renderTerms(raw) {
  const hits = termsFor(raw);
  const host = document.getElementById("term-results");
  if (!hits.length) {
    host.innerHTML = `<p class="muted">没有这个词。它可能是模型随手写的句子，不是看板上的固定说法。</p>`;
    return;
  }
  host.innerHTML = hits.map((item) => `<article class="term-hit"><strong>${esc(item.name)}</strong><p>${esc(item.text)}</p></article>`).join("");
}

function marksFor(doc, label) {
  const hit = (doc.candidate_marks || []).find((row) => row && row.label === label);
  return hit && hit.marks ? hit.marks.join("；") : "";
}

function newestFirst(rows) {
  return Array.isArray(rows) ? rows.slice().reverse() : [];
}

  connection: "连接失败后重试",

function toolSituation(detail) {
  const names = String(detail || "").split(",").map((name) => name.trim()).filter(Boolean);
  const parts = [];
  if (names.includes("quick_check")) parts.push("草稿交给本机编译并对答案");
  if (names.includes("lookup_msl")) parts.push("在本机查阅 MSL 资料");
  const other = names.filter((name) => name !== "quick_check" && name !== "lookup_msl");
  if (other.length) parts.push("调用 " + other.join("、"));
  const what = parts.length ? parts.join("；") : "调用了工具";
  return "正常工具调用，不是异常。" + what + "。";
}

function epicFeed(lines) {
  const body = !lines || !lines.length
    ? `<p class="muted">还没有这场的 epic。hmz 一开始就会写下开始、打开会话、花费和结束。</p>`
    : lines.map((row) => `<p><b>${esc(row.who)}</b> ${esc(row.text)}</p>`).join("");
  return `<div class="note-list pi-live" id="epic-live">${body}</div>`;
}

function piFeed(lines) {
  const body = !lines || !lines.length
    ? `<p class="muted">只显示这场会话最近的几十行。更早的留在 pi 自己的会话文件里。</p>`
    : lines.map((row) => `<p><b>${esc(row.who)}</b> ${esc(row.text)}</p>`).join("");
  return `<div class="note-list pi-live" id="pi-live">${body}</div>`;
}

function writerMode(doc) {
  return doc && doc.kernel_writer === "pi" ? "pi" : "chat";
}

function writerNote(doc) {
  if (writerMode(doc) === "pi") {
    return `<p class="muted">这一场写内核走 hmz 和 pi。规划在回合列表里。下面两块只在这种模式下刷新。</p>`;
  }
  return `<p class="muted">这一场由搜索直接调用模型。回合列表只保留截短的发出、思考和收到。更早的可以往上翻。</p>`;
}

function turnSituation(row) {
  if (row.kind === "tool") return toolSituation((row.tools || []).join(", "));
  return NOTE_KIND[row.kind] || row.kind || "回合";
}

function turnKey(row) {
  if (row.min_seq != null) return "seq:" + row.min_seq;
  if (row.kind === "stopped") return "stopped:" + (row.error || "");
  return "live:" + (row.label || "") + ":" + (row.kind || "");
}

function openTurnKeys() {
  const host = document.getElementById("turns-live");
  const keys = new Set();
  if (!host) return keys;
  host.querySelectorAll("details[open][data-turn]").forEach((node) => keys.add(node.dataset.turn));
  return keys;
}

function renderTurn(row, openKeys) {
  const seconds = row.seconds == null ? "" : (Number(row.seconds).toFixed(0) + " 秒");
  const tokens = row.tokens == null ? "" : (row.tokens + " token");
  const cost = row.cost_usd == null ? "" : ("$" + num(row.cost_usd));
  const head = [turnSituation(row), row.label || "", row.model || "—", seconds, tokens, cost].filter(Boolean).join(" · ");
  const bits = [];
  if (row.sent) bits.push(`<p><b>${row.kind && row.kind.indexOf("agent") === 0 ? "本场" : "发出"}</b> ${esc(row.sent)}</p>`);
  if (row.thinking) bits.push(`<p><b>思考</b> ${esc(row.thinking)}</p>`);
  if (row.preview_thinking) bits.push(`<p><b>正在想</b> ${esc(row.preview_thinking)}</p>`);
  if (row.reply) bits.push(`<p><b>收到</b> ${esc(row.reply)}</p>`);
  if (row.preview) bits.push(`<p><b>正在接收</b> ${esc(row.preview)}</p>`);
  if (row.tools && row.tools.length) bits.push(`<p><b>工具</b> ${esc(row.tools.join("、"))}</p>`);
  if (row.retries && row.retries.length) bits.push(`<p><b>重试</b> ${esc(row.retries.join("；"))}</p>`);
  if (row.error) bits.push(`<p><b>失败</b> ${esc(row.error)}</p>`);
  if (row.stale) bits.push(`<p class="muted">预览已停</p>`);
  const key = turnKey(row);
  const open = openKeys && openKeys.has(key) ? " open" : "";
  return `<details data-turn="${esc(key)}"${open}><summary>${esc(head)}</summary>${bits.join("")}</details>`;
}

function turnsFeed(rows, cursor, openKeys) {
  const earlier = cursor == null ? "" : `<p><button type="button" id="turns-earlier">更早</button></p>`;
  const body = !rows || !rows.length ? `<p class="muted">还没有模型回合。</p>` : rows.map((row) => renderTurn(row, openKeys)).join("");
  return `<div class="note-list" id="turns-live">${earlier}${body}</div>`;
}

const STAGES = [["screen", "安检"], ["compile", "编译"], ["abi", "签名"], ["safety", "内存安全"], ["correctness", "对答案"], ["bench", "计时"]];
const FAIL = {rejected: "screen", compile_error: "compile", abi_error: "abi", unsafe: "safety", incorrect: "correctness"};
let selectedCandidate = "";
let detailDoc = null;
let detailId = "";

function pickCandidate(doc) {
  const rows = doc.candidates || [];
  const cand = rows.find((row) => row.label === selectedCandidate) || newestFirst(rows)[0] || null;
  const progress = doc.eval_progress;
  const inflight = doc.state && doc.state.inflight_label;
  const live = doc.status === "running" && progress && !progress.finished && cand && inflight === cand.label;
  return {mode: live ? "live" : "past", cand, progress};
}

function stageMarkup(doc) {
  const view = pickCandidate(doc);
  const order = STAGES.map((pair) => pair[0]);
  let current = "screen";
  let failed = null;
  if (view.mode === "live") {
    current = (view.progress && view.progress.stage) || "screen";
    if (current === "done") current = "bench";
  } else if (view.cand && view.cand.status) {
    failed = FAIL[view.cand.status] || null;
    if (view.cand.status === "ok") current = "done";
    else if (failed) current = failed;
    else current = view.cand.stage || "screen";
  }
  const here = order.indexOf(current);
  const steps = STAGES.map((pair, index) => {
    const key = pair[0];
    const name = pair[1];
    let mark = "○";
    let klass = "stage";
    let meta = "未到";
    if (failed === key) {
      mark = "×";
      klass = "stage on";
      meta = (view.cand && view.cand.status) || "失败";
    } else if (current === "done" || (here > index && failed !== key)) {
      mark = "✓";
      meta = "完成";
    } else if (key === current) {
      mark = "●";
      klass = "stage on";
      meta = "进行中";
    }
    if (view.mode === "live" && key === "correctness" && current === "correctness" && view.progress) {
      const progress = view.progress;
      meta = "进行中" + (progress.case ? "  用例 " + progress.case : "") + (progress.cases_total ? "  " + (progress.cases_done || 0) + "/" + progress.cases_total : "");
    }
    if (view.mode === "live" && key === "bench" && current === "bench" && view.progress) {
      const progress = view.progress;
      meta = "第 " + (progress.attempt || 1) + " 次" + (progress.attempts_max ? " / " + progress.attempts_max : "") + (progress.noisy ? "  太吵" : "");
    }
    if (view.mode === "past" && view.cand && view.cand.status === "ok" && view.cand.mode === "quick" && key === "bench") {
      mark = "○";
      meta = "未到";
      klass = "stage";
    }
    const tone = mark === "×" ? " red" : (mark === "✓" || mark === "●" ? " green" : "");
    const lamp = String(meta).startsWith("进行中") ? `<span class="breathe" title="进行中"></span>` : "";
    return `<div class="${klass}"><span class="mark${tone}">${mark}</span><span class="name">${esc(name)}</span><span class="meta">${lamp}${esc(meta)}</span></div>`;
  }).join("");
  const who = view.mode === "live"
    ? ((doc.state && doc.state.inflight_label) || (view.progress && view.progress.task) || "")
    : ((view.cand && view.cand.label) || "");
  const bits = [];
  if (view.mode === "past" && view.cand) {
    if (view.cand.candidate_us != null) bits.push(`${Number(view.cand.candidate_us).toFixed(1)} 微秒`);
    if (view.cand.speedup != null) bits.push(String(view.cand.speedup));
    if (view.cand.roofline && view.cand.roofline.bound) bits.push("屋顶 " + view.cand.roofline.bound);
  }
  const code = view.cand && view.cand.excerpt
    ? `<pre class="excerpt">${esc(view.cand.excerpt)}</pre>`
    : `<p class="muted">这颗候选没有留下内核片段。</p>`;
  return `<h3>阶段</h3><p class="sub">${esc(who)}</p>${steps}${bits.length ? `<p class="sub">${esc(bits.join(" · "))}</p>` : ""}<h3>代码</h3>${code}`;
}

function openStage(label) {
  if (!detailDoc || !label) return;
  selectedCandidate = label;
  const modal = document.getElementById("stage-modal");
  document.getElementById("stage-modal-title").textContent = label;
  document.getElementById("stage-modal-body").innerHTML = stageMarkup(detailDoc);
  modal.classList.add("open");
  document.querySelectorAll("#view-detail tr.pick").forEach((row) => row.classList.toggle("on", row.dataset.label === selectedCandidate));
}

function bindCandidatePicks(host) {
  host.querySelectorAll("tr.pick button.seq-open").forEach((button) => button.addEventListener("dblclick", () => {
    const row = button.closest("tr");
    openStage(row && row.dataset.label);
  }));
}

function renderDetail(doc) {
  const point = doc.confirmed_point;
  const searchBest = point && point.search_speedup != null && point.search_speedup !== point.speedup
    ? ` · 搜索最好 ${esc(num(point.search_speedup))}（搜索口径，不对外，噪声偏大）`
    : "";
  const spread = point && point.best != null && point.worst != null && point.worst > 0
    ? `，极差 ${esc(((point.best - point.worst) / point.worst * 100).toFixed(1))}%`
    : "";
  const batchNote = point && point.batches && point.batches.length > 1
    ? `（${point.batches.length} 批独立输入，取中位；各批 ${point.batches.map((v) => esc(num(v))).join(" / ")}` +
      `${point.best != null ? `；最好 ${esc(num(point.best))}` : ""}${point.worst != null ? `，最差 ${esc(num(point.worst))}` : ""}${spread}）`
    : "";
  const confirm = point
    ? `<p>确认点（可对外）：<b>${esc(point.speedup)}</b>${batchNote}${searchBest} · 花费 $${esc(num(point.cost_usd))}</p>`
    : `<p class="muted">确认点：还没有可以发布的确认测量。</p>`;
  const handoff = doc.handoff || {};
  const rounds = newestFirst(handoff.rounds).map((row) => `<tr><td>${esc(row.label)}</td><td>${esc(row.committee)}</td><td>${esc(row.model || "—")}</td></tr>`).join("");
  const handoffBlock = handoff.recorded
    ? `<table><thead><tr><th>轮次</th><th>委员会</th><th>模型</th></tr></thead><tbody>${rounds}</tbody></table>`
    : `<p class="muted">${esc(handoff.note || "没有委员会记录")}</p>`;
  const events = newestFirst(doc.budget_events).map((row) => `<tr><td>${esc(row.time || row.t)}</td><td>${esc(row.kind)}</td><td>${esc(row.who)}</td><td>${esc(num(row.old_budget_usd))}</td><td>${esc(num(row.new_budget_usd))}</td><td>${esc(row.note)}</td></tr>`).join("");
  const candidates = newestFirst(doc.candidates).map((row) => `<tr class="pick${row.label === selectedCandidate ? " on" : ""}" data-label="${esc(row.label)}"><td class="seq"><button type="button" class="quiet seq-open" title="双击查看阶段和代码">${esc(num(row.idx))}</button></td><td>${esc(row.label)}${row.label === seedKernel ? ' <span class="badge">种子核</span>' : ''}${row.label === confirmWinner ? ' <span class="badge">确认胜者</span>' : ''}</td><td>${esc(row.status)}</td><td>${esc(row.stage)}</td><td>${esc(num(row.speedup))}</td><td>${esc(marksFor(doc, row.label))}</td><td>${esc(row.message)}</td></tr>`).join("");
  const grid = newestFirst(doc.feature_grid).map((cell) => `<tr><td>${esc(cell.label)}</td><td>${esc((cell.signature || []).join(","))}</td><td>${esc(num(cell.speedup))}</td><td>${cell.published ? "发布" : ""}</td></tr>`).join("");
  const plans = newestFirst(doc.plan_outcomes).map((node) => `<tr><td>${esc(node.round)}</td><td>${esc(node.label)}</td><td>${esc(node.title)}</td><td>${esc(node.outcome)}</td><td>${esc(num(node.speedup))}</td></tr>`).join("");
  const lamp = doc.status === "running" ? `<span class="breathe" title="进行中"></span>` : "";
  const seedKernel = (doc.state && doc.state.best_label) || (doc.result && doc.result.best_label) || "";
  const confirmWinner = (doc.result && doc.result.confirm_winner_label) || "";
  const seedLine = seedKernel
    ? `<p class="muted">种子核（搜索期当前最好的一颗）：<b>${esc(seedKernel)}</b>` +
      (confirmWinner && confirmWinner !== seedKernel ? ` · 确认胜者（换一批输入重测后活下来的）：<b>${esc(confirmWinner)}</b>` : "") +
      `</p>`
    : "";
  return `<h2>${esc(doc.id)}</h2><p>${lamp}${esc(doc.publication)} ${esc(num(doc.published_speedup))}</p>${seedLine}` +
    `<div>` +
    `<h3>确认点</h3>${confirm}` +
    `<h3>候选</h3>` + (candidates ? `<table><thead><tr><th>序号</th><th>标签</th><th>状态</th><th>阶段</th><th>加速比</th><th>标记</th><th>说明</th></tr></thead><tbody>${candidates}</tbody></table>` : `<p class="muted">没有候选。</p>`) +
    `<h3>委员会交接</h3>${handoffBlock}` +
    `<h3>预算事件</h3>` + (events ? `<table><thead><tr><th>时间</th><th>种类</th><th>谁</th><th>旧预算</th><th>新预算</th><th>备注</th></tr></thead><tbody>${events}</tbody></table>` : `<p class="muted">没有预算事件。</p>`) +
    `<h3>回合</h3>` + writerNote(doc) + `<div class="note-list" id="turns-live"></div>` +
    (writerMode(doc) === "pi"
      ? `<h3>hmz epic</h3>` + epicFeed(null) + `<h3>pi 输出</h3>` + piFeed(null)
      : "") +
    `<h3>特征格子</h3>` + (grid ? `<table><thead><tr><th>标签</th><th>签名</th><th>加速比</th><th></th></tr></thead><tbody>${grid}</tbody></table>` : `<p class="muted">空</p>`) +
    `<h3>计划结局</h3>` + (plans ? `<table><thead><tr><th>轮</th><th>标签</th><th>方案</th><th>结局</th><th>加速比</th></tr></thead><tbody>${plans}</tbody></table>` : `<p class="muted">空</p>`) +
    feedbackMarkup(doc) +
    `</div>`;
}

function feedbackMarkup(doc) {
  const feedback = doc.feedback || {};
  const records = feedback.records || [];
  if (!records.length) return `<h3>代理反馈与队友交接</h3><p class="muted">这场没有反馈。</p>`;
  const blocks = records.map((record) => {
    const who = [[record.provider, record.model].filter(Boolean).join("/"), record.effort].filter(Boolean).join(":");
    const meta = [record.round != null ? "第 " + record.round + " 轮" : "", record.committee, who, record.outcome || record.exit,
      record.seed_label ? "当时的种子核 " + record.seed_label : "", record.best_speedup != null ? "种子成绩 " + num(record.best_speedup) : "", record.work_dir].filter((part) => part != null && part !== "").join(" · ");
    const claims = (record.claims || []).map((claim) => {
      const handle = claim.status === "info" ? "" : `<button type="button" class="feedback-open" data-seq="${esc(claim.seq)}" data-digest="${esc(claim.digest)}">处理</button>`;
      const tone = claim.audience === "system" || claim.audience === "peer" || claim.audience === "diagnostic" ? claim.audience : "system";
      const statusClass = claim.status === "pending" ? " fb-pending" : (claim.status === "info" ? " fb-info" : "");
      return `<article class="fb-claim fb-${esc(tone)}"><div class="fb-claim-head"><span class="fb-kind">${esc(claim.section)}</span> <span class="badge">${esc(claim.premise || claim.audience)}</span> <span class="badge${statusClass}">${esc(claim.status)}</span> ${handle}</div><pre class="excerpt">${esc(claim.text)}</pre></article>`;
    }).join("");
    const raw = record.raw ? `<details class="fb-raw"><summary>原文</summary><pre class="excerpt">${esc(record.raw)}</pre></details>` : "";
    const cuts = (record.truncated_sections || []).filter(Boolean);
    const cut = cuts.length ? `<p class="fb-cut">已截断：${esc(cuts.join("、"))}</p>` : "";
    return `<section class="fb-session"><header class="fb-head"><strong>${esc(record.label || "一场")}</strong><span class="fb-meta">${esc(meta)}</span></header>${cut}<div class="fb-claims">${claims}</div>${raw}</section>`;
  }).join("");
  return `<h3>代理反馈与队友交接</h3><div class="fb-list">${blocks}</div>`;
}

function bindFeedback(host, doc) {
  host.querySelectorAll(".feedback-open").forEach((button) => {
    button.addEventListener("click", () => {
      const record = ((doc.feedback || {}).records || []).find((item) => String(item.seq) === button.dataset.seq);
      const claim = record && (record.claims || []).find((item) => item.digest === button.dataset.digest);
      if (!record || !claim) return;
      const modal = document.getElementById("feedback-modal");
      const form = document.getElementById("feedback-review-form");
      modal.dataset.seq = claim.seq;
      modal.dataset.digest = claim.digest;
      modal._record = record;
      document.getElementById("feedback-modal-title").textContent = claim.section || "处理反馈";
      document.getElementById("feedback-modal-text").textContent = claim.text || "";
      document.getElementById("feedback-modal-source").textContent = record.report_path ? `证据预填来源 ${record.report.source || ""} ${record.report_path}` : "";
      form.querySelector('[name="status"]').value = claim.status || "pending";
      form.querySelector('[name="verification"]').value = claim.verification || "unchecked";
      form.querySelector('[name="evidence_source"]').value = claim.evidence_source || "";
      form.querySelector('[name="evidence"]').value = claim.evidence || "";
      form.querySelector('[name="note"]').value = claim.note || "";
      form.querySelector('[name="topic"]').value = claim.topic || "";
      form.querySelector('[name="change_ref"]').value = claim.change_ref || "";
      document.getElementById("feedback-modal-error").textContent = "";
      modal.classList.add("open");
    });
  });
}

async function loadDetail(id) {
  const query = detailId === id && detailStamp ? "?stamp=" + encodeURIComponent(detailStamp) : "";
  const response = await fetch("/api/v2/runs/" + id.split("/").map(encodeURIComponent).join("/") + query);
  const doc = await response.json();
  const host = document.getElementById("view-detail");
  if (!response.ok) {
    host.innerHTML = `<p>找不到 ${esc(id)}</p>`;
    return;
  }
  if (doc.same) {
    refreshLive();
    return;
  }
  if (detailId !== id) {
    detailId = id;
    selectedCandidate = "";
    document.getElementById("stage-modal").classList.remove("open");
    piStamp = "";
    turnsStamp = "";
    turnsRows = [];
    turnsCursor = null;
  }
  detailDoc = doc;
  detailStamp = doc.detail_stamp || "";
  host.innerHTML = renderDetail(doc);
  bindCandidatePicks(host);
  bindFeedback(host, doc);
  if (document.getElementById("stage-modal").classList.contains("open") && selectedCandidate) openStage(selectedCandidate);
  refreshTurns(true);
  refreshLive();
}

function ledgerTable(title, headers, rows) {
  const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("");
  return `<h3>${esc(title)}</h3><table><thead><tr>${headers.map((name) => `<th>${esc(name)}</th>`).join("")}</tr></thead><tbody>${body || `<tr><td colspan="${headers.length}">空</td></tr>`}</tbody></table>`;
}

    : `将删除算子 ${name}：按题目名把这个算子下已结束的搜索一起归档。有一次还在跑就整次拒绝。花费账本的金额保留。`;

async function loadLedger() {
  const doc = await (await fetch("/api/v2/ledger")).json();
  const operators = (doc.by_operator || []).map((row) => [row.operator, row.runs, row.spent_usd, row.budget_usd]);
  const months = newestFirst(doc.by_month).map((row) => [row.month, row.runs, row.spent_usd, (row.operators || []).map((item) => `${item.operator} $${item.spent_usd}`).join(", ")]);
  let deletions = [];
  try {
    deletions = newestFirst((await (await fetch("/api/records/deletions")).json()).deletions);
  } catch (error) {
    deletions = [];
  }
  const removed = deletions.map((row) => [row.t, row.kind, row.name, row.ip || "", row.reason, (row.runs || []).length]);
  document.getElementById("view-ledger").innerHTML =
    `<p>总额 $${esc(doc.spent_usd)} · 结转 $${esc(doc.carryover_usd)} · ${esc(doc.runs)} 次计入账本</p>` +
    ledgerTable("按算子", ["算子", "次数", "花费", "预算"], operators) +
    ledgerTable("按月份", ["月份", "次数", "花费", "算子"], months) +
    ledgerTable("删除记录", ["时间", "种类", "名字", "IP", "理由", "次数"], removed) +
    `<p class="muted">删除记录只追加，页面上不能删。</p>`;
}

async function postJson(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Observe-Token": OBSERVE_TOKEN},
    body: JSON.stringify(body || {}),
  });
  const doc = await response.json();
  if (!response.ok) throw new Error(doc.error || String(response.status));
  return doc;
}

document.getElementById("term-suggest").innerHTML = ["计划结局", "falsified", "untested_impl_fail", "确认点", "加速比"].map((name) => `<button type="button" class="quiet" data-term="${esc(name)}">${esc(name)}</button>`).join("");
document.getElementById("term-suggest").addEventListener("click", (event) => {
  const button = event.target.closest("[data-term]");
  if (!button) return;
  const box = document.getElementById("term-query");
  box.value = button.dataset.term;
  renderTerms(box.value);
});
document.getElementById("feedback-review-form").querySelector('[name="evidence_source"]').addEventListener("change", (event) => {
  const modal = document.getElementById("feedback-modal");
  const evidence = document.getElementById("feedback-review-form").querySelector('[name="evidence"]');
  const feedback = (detailDoc && detailDoc.feedback) || {};
  if (event.target.value === "calibration" && feedback.calibration) evidence.value = JSON.stringify(feedback.calibration);
  if (event.target.value === "report") {
    const record = modal._record;
    evidence.value = record && record.report ? JSON.stringify(record.report) : "";
  }
});
document.getElementById("feedback-save").addEventListener("click", async () => {
  const modal = document.getElementById("feedback-modal");
  const form = document.getElementById("feedback-review-form");
  const body = {
    status: form.querySelector('[name="status"]').value,
    verification: form.querySelector('[name="verification"]').value,
    evidence_source: form.querySelector('[name="evidence_source"]').value,
    evidence: form.querySelector('[name="evidence"]').value,
    note: form.querySelector('[name="note"]').value,
    topic: form.querySelector('[name="topic"]').value,
    change_ref: form.querySelector('[name="change_ref"]').value,
  };
  try {
    await postJson("/api/runs/" + selectedRun.split("/").map(encodeURIComponent).join("/") + "/feedback/" + encodeURIComponent(modal.dataset.seq) + "/claims/" + encodeURIComponent(modal.dataset.digest) + "/review", body);
    modal.classList.remove("open");
    loadDetail(selectedRun);
    refreshBanner();
  } catch (error) {
    document.getElementById("feedback-modal-error").textContent = error.message;
  }
});
document.getElementById("settings-open").addEventListener("click", async () => {
  const doc = await (await fetch("/api/settings/model")).json();
  const options = (doc.choices || []).map((item) => `<option value="${esc(item.provider)}\t${esc(item.id)}">${esc(item.provider)} ${esc(item.id)}</option>`).join("");
  const rows = (doc.committees || []).length ? doc.committees : [
    {name: "first", provider: doc.provider, model: doc.model},
    {name: "second", provider: doc.provider, model: doc.model},
  ];
  const host = document.getElementById("settings-committees");
  host.innerHTML = rows.map((row) => `<label>${esc(row.name)} <select data-committee="${esc(row.name)}">${options}</select></label>`).join("");
  for (const select of host.querySelectorAll("select")) {
    const row = rows.find((item) => item.name === select.dataset.committee) || {};
    const current = `${row.provider}\t${row.model}`;
    for (const option of select.options) if (option.value === current) option.selected = true;
  }
  document.getElementById("settings-note").textContent = "下一次搜索按这两个委员会读模型。正在跑的搜索不变。两个可以选同一个。";
  document.getElementById("settings-modal").classList.add("open");
});
document.getElementById("settings-save").addEventListener("click", async () => {
  const committees = [...document.querySelectorAll("#settings-committees select")].map((select) => {
    const [provider, model] = select.value.split("\t");
    return {name: select.dataset.committee, provider, model};
  });
  try {
    await postJson("/api/settings/model", {committees});
    document.getElementById("settings-modal").classList.remove("open");
  } catch (error) {
    document.getElementById("settings-note").textContent = error.message;
  }
});
document.getElementById("settings-close").addEventListener("click", () => document.getElementById("settings-modal").classList.remove("open"));
document.getElementById("delete-close").addEventListener("click", () => document.getElementById("delete-modal").classList.remove("open"));
document.getElementById("delete-save").addEventListener("click", async () => {
  if (!deleteTarget) return;
  const reason = document.getElementById("delete-reason").value.trim();
  if (!reason) {
    document.getElementById("delete-note").textContent = "要写删除理由。";
    return;
  }
  try {
    await postJson("/api/records/delete", {kind: deleteTarget.kind, name: deleteTarget.name, reason});
    document.getElementById("delete-modal").classList.remove("open");
    if (deleteTarget.kind === "experiment" && selectedExperiment === deleteTarget.name) selectedExperiment = "";
    deleteTarget = null;
    loadExperiments();
    loadRuns();
    if (selectedExperiment) loadCompare(selectedExperiment);
  } catch (error) {
    document.getElementById("delete-note").textContent = error.message;
  }
});
document.getElementById("reset-all").addEventListener("click", async () => {
  const preview = await (await fetch("/api/budget/reset")).json();
  const count = (preview.runs || []).length;
  if (!count || !window.confirm(`重置 ${count} 个搜索，每个在现有预算上加 $${preview.add_usd}？`)) return;
  try { await postJson("/api/budget/reset"); } catch (error) { window.alert(error.message); }
});
document.getElementById("stop-all").addEventListener("click", async () => {
  const preview = await (await fetch("/api/stop")).json();
  const count = (preview.groups || []).length;
  if (!count || !window.confirm(`停止 ${count} 组正在跑的搜索？`)) return;
  try { await postJson("/api/stop"); } catch (error) { window.alert(error.message); }
});
document.getElementById("run-filters").addEventListener("submit", (event) => {
  event.preventDefault();
  for (const key of ["task", "dtype", "model", "status"]) applied[key] = document.getElementById("filter-" + key).value.trim();
  runsOffset = 0;
  loadRuns();
});
document.getElementById("runs-prev").addEventListener("click", () => {
  runsOffset = Math.max(0, runsOffset - RUNS_LIMIT);
  loadRuns();
});
document.getElementById("runs-next").addEventListener("click", () => {
  runsOffset += RUNS_LIMIT;
  loadRuns();
});
document.getElementById("budget-banner").addEventListener("click", (event) => {
  const link = event.target.closest("a[data-run]");
  if (!link) return;
  event.preventDefault();
  selectedRun = link.dataset.run;
  showRight("detail");
});

let piStamp = "";
let turnsStamp = "";
let turnsRows = [];
let turnsCursor = null;
let detailStamp = "";
let seenIndex = "";
let seenTurns = "";

function paintLive(id, html, atBottom) {
  const host = document.getElementById(id);
  if (!host) return;
  host.outerHTML = html;
  const again = document.getElementById(id);
  if (again && atBottom) again.scrollTop = again.scrollHeight;
}

function turnsIdentity(stamp) {
  return String(stamp || "").split(".").slice(0, 3).join(".");
}

function bindTurns() {
  const button = document.getElementById("turns-earlier");
  if (button) button.addEventListener("click", loadEarlier);
}

function paintTurns(stick) {
  const host = document.getElementById("turns-live");
  const open = openTurnKeys();
  const beforeTop = host ? host.scrollTop : 0;
  const atBottom = stick && host && host.scrollHeight - host.scrollTop - host.clientHeight < 24;
  paintLive("turns-live", turnsFeed(turnsRows, turnsCursor, open), false);
  bindTurns();
  const again = document.getElementById("turns-live");
  if (!again) return;
  again.scrollTop = atBottom ? again.scrollHeight : beforeTop;
}

async function refreshTurns(reset) {
  if (!selectedRun || visible !== "detail") return;
  if (!document.getElementById("turns-live")) return;
  const parts = [];
  if (!reset && turnsStamp) parts.push("stamp=" + encodeURIComponent(turnsStamp));
  const query = parts.length ? "?" + parts.join("&") : "";
  const response = await fetch("/api/v2/turns/" + selectedRun.split("/").map(encodeURIComponent).join("/") + query);
  if (!response.ok) return;
  const doc = await response.json();
  if (doc.same) return;
  const identity = turnsIdentity(doc.stamp);
  if (reset || !turnsStamp || identity !== turnsIdentity(turnsStamp)) {
    turnsRows = doc.rows || [];
  } else {
    const incoming = doc.rows || [];
    const older = turnsRows.slice(0, Math.max(0, turnsRows.length - incoming.length));
    turnsRows = older.concat(incoming);
  }
  turnsStamp = doc.stamp || "";
  turnsCursor = doc.cursor == null ? null : doc.cursor;
  paintTurns(true);
}

async function loadEarlier() {
  if (turnsCursor == null || !selectedRun) return;
  const host = document.getElementById("turns-live");
  const open = openTurnKeys();
  const beforeHeight = host ? host.scrollHeight : 0;
  const beforeTop = host ? host.scrollTop : 0;
  const response = await fetch("/api/v2/turns/" + selectedRun.split("/").map(encodeURIComponent).join("/") + "?before=" + encodeURIComponent(turnsCursor));
  if (!response.ok) return;
  const doc = await response.json();
  const older = doc.rows || [];
  turnsRows = older.concat(turnsRows);
  turnsCursor = doc.cursor == null ? null : doc.cursor;
  paintLive("turns-live", turnsFeed(turnsRows, turnsCursor, open), false);
  bindTurns();
  const again = document.getElementById("turns-live");
  if (again) again.scrollTop = beforeTop + (again.scrollHeight - beforeHeight);
}

async function refreshLive() {
  if (!detailDoc || !selectedRun || visible !== "detail") return;
  if (writerMode(detailDoc) !== "pi") return;
  const host = document.getElementById("pi-live");
  const epic = document.getElementById("epic-live");
  if (!host && !epic) return;
  const stick = (box) => box && box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const atBottom = stick(host);
  const epicBottom = stick(epic);
  const query = piStamp ? "?stamp=" + encodeURIComponent(piStamp) : "";
  const response = await fetch("/api/v2/pi/" + selectedRun.split("/").map(encodeURIComponent).join("/") + query);
  if (!response.ok) return;
  const doc = await response.json();
  if (doc.same) return;
  piStamp = doc.stamp || "";
  paintLive("epic-live", epicFeed(doc.epics), epicBottom);
  paintLive("pi-live", piFeed(doc.lines), atBottom);
}
setInterval(() => { refreshTurns(false); refreshLive(); }, 2000);

loadExperiments();
loadRuns();
const preset = new URLSearchParams(location.search).get("run");
if (preset) {
  selectedRun = preset;
  showRight("detail");
}
const source = new EventSource("/api/v2/stream");
source.onmessage = (event) => {
  const frame = JSON.parse(event.data);
  const indexRev = frame.index_revision || frame.revision || 0;
  const turnsRev = frame.turns_revision || 0;
  if (indexRev && String(indexRev) !== seenIndex) {
    seenIndex = String(indexRev);
    refreshBanner();
    loadExperiments();
    if (selectedExperiment) loadCompare(selectedExperiment);
    loadRuns();
    if (visible === "ledger") loadLedger();
    else if (selectedRun) loadDetail(selectedRun);
  }
  if (turnsRev && String(turnsRev) !== seenTurns) {
    seenTurns = String(turnsRev);
    if (selectedRun && visible === "detail") refreshTurns(true);
  }
};
</script>

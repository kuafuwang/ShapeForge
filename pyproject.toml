[project]
name = "ai-lowering"
version = "0.1.0"
description = "ShapeForge: evidence-first generation, exact dispatch and validation of specialized GPU kernels on Metal and simulated NPU targets."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "mlx>=0.22",
    "pyobjc-core>=10.3",
    "pyobjc-framework-Metal>=10.3",
    "openai>=1.60",
    "matplotlib>=3.9",
    "pytest>=8.0",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "pytest-xdist>=3.8",
]

[project.optional-dependencies]
grpc = [
    "googleapis-common-protos>=1.70.0,<2",
    "grpcio>=1.69.0,<2",
    "grpcio-status>=1.69.0,<2",
    "protobuf>=5.29.3,<6",
]

[dependency-groups]
dev = [
    "googleapis-common-protos>=1.70.0,<2",
    "grpcio>=1.69.0,<2",
    "grpcio-status>=1.69.0,<2",
    "protobuf>=5.29.3,<6",
]
codegen = [
    "grpcio-tools==1.69.0",
]

[project.scripts]
tcenv = "tcenv.cli:main"
taic = "taic.cli:main"
taic-selfcheck = "taic.selfcheck_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcenv", "taic", "tasks", "observe", "experiments"]

[tool.hatch.build.targets.wheel.force-include]
"observe/static/index.html" = "observe/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认按逻辑核并行。loadgroup 让 conftest 打上 xdist_group("gpu") 的用例固定在一个 worker，
# 其余按负载分散；串行调试用 `uv run pytest -n 0 ...`，GPU/LLM 测试仍由 marker 和 GPU lock 控制。
addopts = ["-ra", "--strict-markers", "--durations=15", "-n", "auto", "--dist", "loadgroup"]
markers = [
    "slow: long-running (hang containment, exhaustive paper-size checks)",
    "gpu: needs a Metal device",
    "llm: calls the LLM endpoint (costs money)",
]

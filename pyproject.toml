[project]
name = "ai-lowering"
version = "0.1.0"
description = "AI lowering on Apple GPUs: an LLM translates Triton kernels directly into Metal Shading Language, inside a verified evaluation environment."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "mlx>=0.22",
    "pyobjc-core>=10.3",
    "pyobjc-framework-Metal>=10.3",
    "openai>=1.60",
    "matplotlib>=3.9",
    "pytest>=8.0",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.scripts]
tcenv = "tcenv.cli:main"
taic = "taic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcenv", "taic", "tasks", "observe"]

[tool.hatch.build.targets.wheel.force-include]
"observe/static/index.html" = "observe/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--durations=15"]
markers = [
    "slow: long-running (hang containment, exhaustive paper-size checks)",
    "gpu: needs a Metal device",
    "llm: calls the LLM endpoint (costs money)",
]
